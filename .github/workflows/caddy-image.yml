name: Caddy image

# Builds deploy/caddy (Caddy + the Cloudflare DNS module) and pushes it to
# GitHub's container registry, so the test server only pulls it:
#
#   ghcr.io/<owner>/sahno-caddy:latest
#   ghcr.io/<owner>/sahno-caddy:sha-<commit>

on:
  push:
    branches:
      - test
    paths:
      - deploy/caddy/**
      - .github/workflows/caddy-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out the tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sahno-caddy"
          echo "list=${image}:latest,${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
