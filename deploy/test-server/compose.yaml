# Sahno TEST environment on a self-managed Docker host (docs/TEST_DEPLOYMENT.md,
# "Self-hosted test server"). Same image as every other environment; only
# configuration differs.
#
#   cp .env.example .env    # then fill it in — .env is gitignored
#   docker compose up -d --build
#
# HTTPS is terminated by a reverse proxy in front of the API:
# - a Caddy the server already runs: add a site for SAHNO_HOST that proxies to
#   127.0.0.1:SAHNO_API_PORT (the default — only the API starts), or
# - the Caddy bundled here, on a host with ports 80/443 free:
#   docker compose --profile caddy up -d --build
#
# Either way the API is only reachable through the proxy (its port is bound
# to 127.0.0.1), which is what makes trusting X-Forwarded-* headers safe.

name: sahno-test

services:
  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      OpenApi__Enabled: "true"
      ConnectionStrings__Sahno: ${SAHNO_DB_CONNECTION:?Set SAHNO_DB_CONNECTION in .env}
      Auth0__Domain: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in .env}
      Auth0__Audience: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in .env}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Push__ExpoAccessToken: ${EXPO_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${SAHNO_API_PORT:-8080}:8080"

  caddy:
    image: caddy:2
    profiles:
      - caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SAHNO_HOST: ${SAHNO_HOST:?Set SAHNO_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keeping them avoids re-issuing on every restart.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
