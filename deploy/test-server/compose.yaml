# Sahno TEST environment on a self-managed Docker host (docs/TEST_DEPLOYMENT.md,
# "Self-hosted test server"). Same API image as every other environment; only
# configuration differs.
#
#   cp .env.example .env    # then fill it in — .env is gitignored
#   docker compose pull && docker compose up -d
#
# Nothing is built here: both images come from GitHub's registry
# (.github/workflows/api-image.yml and caddy-image.yml).
#
# HTTPS is terminated in front of the API by either:
# - the Caddy here (profile "caddy"), on SAHNO_HTTPS_PORT — 8443 on the Farnese
#   sandbox server, whose 80/443 belong to its own Caddy; or
# - a reverse proxy the server already runs (no profile; see
#   compose.shared-proxy.yaml when that proxy is itself a container).
# Pick with COMPOSE_PROFILES in .env.
#
# Whichever it is, the API is reachable only through it (its host port is
# bound to 127.0.0.1), which is what makes trusting X-Forwarded-* safe.

name: sahno-test

services:
  sahno-api:
    # Built and tested on GitHub; this host only pulls it. Pin a sha-<commit>
    # tag with SAHNO_API_IMAGE to roll back.
    image: ${SAHNO_API_IMAGE:-ghcr.io/devadarshsharma/sahno-api:test}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      OpenApi__Enabled: "true"
      ConnectionStrings__Sahno: ${SAHNO_DB_CONNECTION:?Set SAHNO_DB_CONNECTION in .env}
      Auth0__Domain: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in .env}
      Auth0__Audience: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in .env}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Push__ExpoAccessToken: ${EXPO_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:${SAHNO_API_PORT:-8080}:8080"

  caddy:
    # Caddy plus the Cloudflare DNS module (deploy/caddy).
    image: ${SAHNO_CADDY_IMAGE:-ghcr.io/devadarshsharma/sahno-caddy:latest}
    profiles:
      - caddy
    restart: unless-stopped
    depends_on:
      - sahno-api
    environment:
      SAHNO_HOST: ${SAHNO_HOST:?Set SAHNO_HOST in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
    ports:
      # Caddy listens on 443 inside the container; the host exposes it on
      # SAHNO_HTTPS_PORT. Port 80 is not published at all.
      - "${SAHNO_HTTPS_PORT:-443}:443"
      - "${SAHNO_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keeping them avoids re-issuing on every restart.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
